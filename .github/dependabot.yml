version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      dev-dependencies:
        dependency-type: development
    ignore:
      # Stay on TS 6 (matches upstream astro-paper; typescript-eslint lacks TS 7 support)
      - dependency-name: typescript
        versions: [">=7"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
